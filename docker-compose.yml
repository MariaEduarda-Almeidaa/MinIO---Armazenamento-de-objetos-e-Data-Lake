
services:
  minio:
    build: ./minio-build
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: seminario123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  lab:
    build: ./lab
    container_name: minio-lab
    depends_on:
      - minio
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: admin
      S3_SECRET_KEY: seminario123
      S3_BUCKET: datalake
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts:/app/scripts
      - ./resultados:/app/resultados
    working_dir: /app
    command: ["sh", "-c", "sleep infinity"]

volumes:
  minio_data:
